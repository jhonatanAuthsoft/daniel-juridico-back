spring.application.name=laweact-server
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laweact}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:laweact}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:laweact}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:4EzTRvc+xQKNaYxc5yor+2BfmGWdQRLbAgX/NsVkuhO+A9Hmuo7vCRPL0TOMIyhTmZi7hx+Y/9XwFV+hcZ8IjQ==}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
