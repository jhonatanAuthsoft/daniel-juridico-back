# =====================================================================================
# LAWEACT SERVER - Docker Compose para Desenvolvimento Local
# =====================================================================================
# Uso:
#   - Só DB local:     docker compose up -d db
#   - DB de testes:    docker compose up -d db-test
#   - App + DB:        docker compose --profile app up -d
#   - Parar:           docker compose down
#   - Limpar dados:    docker compose down -v
# =====================================================================================

services:
  # =====================================================================================
  # PostgreSQL — desenvolvimento
  # =====================================================================================
  db:
    image: postgres:16-alpine
    container_name: laweact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laweact
      POSTGRES_USER: laweact
      POSTGRES_PASSWORD: laweact
    ports:
      - "5432:5432"
    volumes:
      - laweact_pg_data:/var/lib/postgresql/data
    networks:
      - laweact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laweact -d laweact"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================================
  # PostgreSQL — testes E2E (perfil Spring: test)
  # =====================================================================================
  db-test:
    image: postgres:16-alpine
    container_name: laweact-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: laweact_test
      POSTGRES_USER: laweact
      POSTGRES_PASSWORD: laweact
    ports:
      - "5433:5432"
    volumes:
      - laweact_pg_test_data:/var/lib/postgresql/data
    networks:
      - laweact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laweact -d laweact_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =====================================================================================
  # Spring Boot Application
  # =====================================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laweact-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/laweact
      SPRING_DATASOURCE_USERNAME: laweact
      SPRING_DATASOURCE_PASSWORD: laweact
      JWT_SECRET: ${JWT_SECRET:-4EzTRvc+xQKNaYxc5yor+2BfmGWdQRLbAgX/NsVkuhO+A9Hmuo7vCRPL0TOMIyhTmZi7hx+Y/9XwFV+hcZ8IjQ==}
      SPRING_PROFILES_ACTIVE: local
    networks:
      - laweact-network
    profiles:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  laweact_pg_data:
    driver: local
  laweact_pg_test_data:
    driver: local

networks:
  laweact-network:
    driver: bridge
