spring:
  application:
    name: laweact-server
  datasource:
    url: jdbc:postgresql://localhost:5432/laweact
    username: laweact
    password: laweact
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

laweact:
  security:
    jwt:
      secret: "change-me-to-a-very-long-secret-key-at-least-256-bits-long!!"
      expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
