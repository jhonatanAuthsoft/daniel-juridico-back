# AWS S3 — keys em application-secrets.properties (não no GitHub)
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket=${AWS_S3_BUCKET:daniel-juridico}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}

laweact.push.enabled=true
laweact.push.base-url=https://exp.host/--/api/v2/push

laweact.jobs.api-key=${JOBS_API_KEY:}
laweact.notificacoes.insistente.interval=PT12H
laweact.notificacoes.insistente.cron=0 0 * * * *
laweact.notificacoes.insistente.scheduler-enabled=true

# Staging APK interno (EXPO_PUBLIC_IAP_PROVIDER=fake) continua no fake store.
# Homolog (TestFlight / Play internal) valida o recibo sandbox da loja neste backend.
# Sem as env abaixo o servidor sobe, mas Assinar no homolog responde 400.
laweact.assinatura.fake-store.enabled=true
laweact.assinatura.fake-store.active-duration=P30D

laweact.assinatura.apple.enabled=${LAWEACT_ASSINATURA_APPLE_ENABLED:true}
laweact.assinatura.apple.bundle-id=com.laweact.app.staging
laweact.assinatura.apple.environment=SANDBOX
laweact.assinatura.apple.issuer-id=${LAWEACT_ASSINATURA_APPLE_ISSUER_ID:}
laweact.assinatura.apple.key-id=${LAWEACT_ASSINATURA_APPLE_KEY_ID:}
laweact.assinatura.apple.private-key=${LAWEACT_ASSINATURA_APPLE_PRIVATE_KEY:}

laweact.assinatura.google.enabled=${LAWEACT_ASSINATURA_GOOGLE_ENABLED:true}
laweact.assinatura.google.package-name=com.laweact.app.staging
laweact.assinatura.google.service-account-json=${LAWEACT_ASSINATURA_GOOGLE_SERVICE_ACCOUNT_JSON:}
