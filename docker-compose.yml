# Laweact Server — Postgres local (sem container da API)
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: laweact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laweact
      POSTGRES_USER: laweact
      POSTGRES_PASSWORD: laweact
    ports:
      - "5432:5432"
    volumes:
      - laweact_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laweact -d laweact"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  laweact_pg_data:
